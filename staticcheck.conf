# Everything is checked except what a test does on purpose. Disabled, each with
# the reason; a finding in any other check, in any package, is a defect.
#
#   SA1012  tests that hand a nil context to a function to see it repaired
#   SA4000  a test that two calls to a random function differ
#   ST1018  test inputs that contain a bidirectional control character on purpose
#
# U1000 (unused code) stays on: it finds dead fields and functions in the
# services. The two unexported fields a test adds on purpose carry their own
# //lint:ignore.
checks = ["all", "-SA1012", "-SA4000", "-ST1018", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
