apiVersion: 1
datasources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: true
      jsonData:
          derivedFields: # log line -> jump to trace
              - name: trace_id
                matcherRegex: '"?trace_id"?[=:]\s*"?(\w+)'
                url: '$${__value.raw}'
                datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      jsonData:
          tracesToLogsV2: # trace -> its logs
              datasourceUid: loki
              filterByTraceID: true
              filterBySpanID: false
