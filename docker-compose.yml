name: ecoop-server

services:
    redis:
        image: redis:7-alpine
        ports: ['6379:6379'] # cache tests (REDIS_TEST_URL)
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 2s
            timeout: 2s
            retries: 15

    # Sentinel cache tests (REDIS_SENTINEL_ADDRS). The sentinel shares the master's
    # network namespace so it reports 127.0.0.1:6380, which the host can reach.
    # The password is a throwaway test credential.
    redis-master:
        image: redis:7-alpine
        command: redis-server --port 6380 --requirepass sentinel-test-pass
        ports:
            - '6380:6380' # master
            - '26379:26379' # sentinel (published here because it shares this namespace)
        healthcheck:
            test: ['CMD', 'redis-cli', '-p', '6380', '-a', 'sentinel-test-pass', '--no-auth-warning', 'ping']
            interval: 2s
            timeout: 2s
            retries: 15

    redis-sentinel:
        image: redis:7-alpine
        network_mode: 'service:redis-master'
        depends_on:
            redis-master:
                condition: service_healthy
        # Sentinel rewrites its config, so it is generated in a writable path.
        command: >
            sh -c 'printf "port 26379\nsentinel monitor mymaster 127.0.0.1 6380 1\nsentinel auth-pass mymaster sentinel-test-pass\nsentinel down-after-milliseconds mymaster 1000\n" > /tmp/sentinel.conf
            && exec redis-sentinel /tmp/sentinel.conf'
        healthcheck:
            test: ['CMD', 'redis-cli', '-p', '26379', 'sentinel', 'get-master-addr-by-name', 'mymaster']
            interval: 2s
            timeout: 2s
            retries: 15

    # Postgres for the SQL service tests (SQL_TEST_DSN). Throwaway test credentials.
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: ecoop
            POSTGRES_PASSWORD: ecoop-test-pass
            POSTGRES_DB: ecoop_test
        ports: ['5432:5432']
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ecoop -d ecoop_test']
            interval: 2s
            timeout: 2s
            retries: 15

    # Single-node Kafka (KRaft, no ZooKeeper) for the broker tests (KAFKA_TEST_BROKERS).
    kafka:
        image: apache/kafka:3.9.0
        ports: ['9092:9092']
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
        healthcheck:
            test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
            interval: 5s
            timeout: 10s
            retries: 20
            start_period: 15s

    loki:
        image: grafana/loki:latest
        command: -config.file=/etc/loki/loki-config.yaml
        ports: ['3100:3100']
        volumes:
            - ./.docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
            - loki-data:/loki
        networks: [obs]

    tempo:
        image: grafana/tempo:latest
        command: -config.file=/etc/tempo/tempo.yaml
        ports: ['3200:3200'] # Tempo HTTP API (Grafana queries here)
        volumes:
            - ./.docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
            - tempo-data:/var/tempo
        networks: [obs]

    alloy:
        image: grafana/alloy:latest
        command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
        ports:
            - '4317:4317' # OTLP gRPC  (app -> alloy)
            - '4318:4318' # OTLP HTTP
            - '12345:12345' # Alloy UI / metrics
        volumes:
            - ./.docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
        depends_on: [loki, tempo]
        networks: [obs]

    grafana:
        image: grafana/grafana:latest
        ports: ['3000:3000']
        env_file: .env
        volumes:
            - ./.docker/grafana/provisioning:/etc/grafana/provisioning:ro
            - grafana-data:/var/lib/grafana
        depends_on: [loki, tempo]
        networks: [obs]

volumes:
    loki-data:
    tempo-data:
    grafana-data:

networks:
    obs:
