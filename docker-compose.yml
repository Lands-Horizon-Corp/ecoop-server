name: ecoop

services:
  postgres:
    image: postgres:18-alpine
    # wal_level=logical lets Debezium stream changes through a replication slot.
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=${POSTGRES_MAX_WAL_SENDERS:-10}
      - -c
      - max_replication_slots=${POSTGRES_MAX_REPLICATION_SLOTS:-10}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoop}
      POSTGRES_DB: ${POSTGRES_DB:-ecoop}
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - app-network

  # The CQRS read model: a second Postgres the app replicates into from the
  # Debezium topics. It is not a CDC source, so it needs no logical WAL.
  postgres-read:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_READ_MAX_CONNECTIONS:-200}
    environment:
      POSTGRES_USER: ${POSTGRES_READ_USER:-ecoop}
      POSTGRES_PASSWORD: ${POSTGRES_READ_PASSWORD:-ecoop}
      POSTGRES_DB: ${POSTGRES_READ_DB:-ecoop_read}
    ports:
      - "${POSTGRES_READ_HOST:-127.0.0.1}:${POSTGRES_READ_PORT:-5433}:5432"
    volumes:
      - postgres-read-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - app-network

  valkey:
    image: valkey/valkey:8.1-alpine
    command: [ "sh", "-c", "exec valkey-server --requirepass \"$$CACHE_PASSWORD\"" ]
    environment:
      CACHE_PASSWORD: ${CACHE_PASSWORD:-ecoop}
    ports:
      - "${CACHE_HOST:-127.0.0.1}:${CACHE_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "valkey-cli -a \"$$CACHE_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - app-network

  storage:
    image: rustfs/rustfs:${STORAGE_IMAGE_TAG:-latest}
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-ecoop}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-ecoop-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_VOLUMES: /data
    ports:
      - "${STORAGE_HOST:-127.0.0.1}:${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_HOST:-127.0.0.1}:${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    restart: unless-stopped
    networks:
      - app-network

  sockudo:
    image: sockudo/sockudo:${BROADCAST_IMAGE_TAG:-latest}
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      PORT: "6001"
      DEBUG: ${BROADCAST_DEBUG:-false}
      ADAPTER_DRIVER: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      RATE_LIMITER_DRIVER: redis
      REDIS_URL: redis://:${CACHE_PASSWORD:-ecoop}@valkey:6379/${BROADCAST_REDIS_DB:-2}
      SOCKUDO_DEFAULT_APP_ID: ${BROADCAST_APP_ID:-ecoop}
      SOCKUDO_DEFAULT_APP_KEY: ${BROADCAST_APP_KEY:-ecoop-key}
      SOCKUDO_DEFAULT_APP_SECRET: ${BROADCAST_APP_SECRET:-ecoop-secret}
      SOCKUDO_DEFAULT_APP_ENABLED: "true"
      SOCKUDO_DEFAULT_APP_MAX_EVENT_PAYLOAD_IN_KB: ${BROADCAST_MAX_PAYLOAD_KB:-5120}
      SOCKUDO_DEFAULT_APP_MAX_PRESENCE_MEMBER_SIZE_IN_KB: ${BROADCAST_MAX_PAYLOAD_KB:-5120}
      MAX_EVENT_PAYLOAD_IN_KB: ${BROADCAST_MAX_PAYLOAD_KB:-5120}
      MAX_PRESENCE_MEMBER_SIZE_IN_KB: ${BROADCAST_MAX_PAYLOAD_KB:-5120}
      WEBSOCKET_MAX_PAYLOAD_KB: ${BROADCAST_MAX_PAYLOAD_KB:-5120}
      METRICS_ENABLED: "true"
      PUSH_ALLOW_MEMORY_DRIVERS: "true"
    ports:
      - "${BROADCAST_HOST:-127.0.0.1}:${BROADCAST_PORT:-6001}:6001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:6001/up || exit 1" ]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: unless-stopped
    networks:
      - app-network

  pdf-engine:
    image: zalven88/pdf-engine:${PDF_IMAGE_TAG:-1.1.0}
    depends_on:
      pdf-storage-setup:
        condition: service_completed_successfully
    environment:
      API_PORT: "6767"
      API_BEARER_TOKEN: ${PDF_ENGINE_API_BEARER_TOKEN:-change-me}
      STORAGE_URL: http://storage:9000
      STORAGE_BUCKET: ${PDF_BUCKET:-pdfs}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-ecoop}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-ecoop-secret}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      RENDER_TIMEOUT_SECS: ${PDF_RENDER_TIMEOUT_SECS:-45}
    ports:
      - "${PDF_ENGINE_API_HOST:-127.0.0.1}:${PDF_ENGINE_API_PORT:-6767}:6767"
    healthcheck:
      test: [ "CMD", "pdf-engine", "healthcheck" ]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - app-network

  pdf-storage-setup:
    image: amazon/aws-cli:${PDF_SETUP_IMAGE_TAG:-latest}
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-ecoop}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-ecoop-secret}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      PDF_BUCKET: ${PDF_BUCKET:-pdfs}
    entrypoint: >
      sh -c "until aws --endpoint-url http://storage:9000 s3api head-bucket --bucket \"$$PDF_BUCKET\" 2>/dev/null ||
                   aws --endpoint-url http://storage:9000 s3 mb \"s3://$$PDF_BUCKET\"; do sleep 1; done"
    networks:
      - app-network

  # Single-node Kafka (KRaft, no ZooKeeper). Containers reach it at
  # kafka:9092; this machine at BROKER_HOST:BROKER_PORT.
  kafka:
    image: apache/kafka:${BROKER_IMAGE_TAG:-latest}
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${BROKER_HOST:-127.0.0.1}:${BROKER_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "${BROKER_HOST:-127.0.0.1}:${BROKER_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  # Debezium = Kafka Connect + the Postgres connector. It talks to the same
  # kafka service as the app (kafka:9092) and publishes row changes to
  # <CDC_TOPIC_PREFIX>.<schema>.<table>, which the app consumes with
  # BrokerService.Subscribe like any other topic.
  debezium:
    image: quay.io/debezium/connect:${CDC_IMAGE_TAG:-3.0}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: ${CDC_CONNECT_GROUP_ID:-ecoop-connect}
      CONFIG_STORAGE_TOPIC: ${CDC_CONNECT_GROUP_ID:-ecoop-connect}.configs
      OFFSET_STORAGE_TOPIC: ${CDC_CONNECT_GROUP_ID:-ecoop-connect}.offsets
      STATUS_STORAGE_TOPIC: ${CDC_CONNECT_GROUP_ID:-ecoop-connect}.status
      CONFIG_STORAGE_REPLICATION_FACTOR: ${CDC_REPLICATION_FACTOR:-1}
      OFFSET_STORAGE_REPLICATION_FACTOR: ${CDC_REPLICATION_FACTOR:-1}
      STATUS_STORAGE_REPLICATION_FACTOR: ${CDC_REPLICATION_FACTOR:-1}
    ports:
      - "${CDC_HOST:-127.0.0.1}:${CDC_PORT:-8083}:8083"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:8083/connectors >/dev/null" ]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  debezium-setup:
    image: curlimages/curl:${CDC_SETUP_IMAGE_TAG:-latest}
    depends_on:
      debezium:
        condition: service_healthy
    environment:
      CONNECT_URL: http://debezium:8083
      CONNECTOR_NAME: ${CDC_CONNECTOR_NAME:-ecoop-postgres}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${CDC_DB_USER:-${POSTGRES_USER:-ecoop}}
      DB_PASSWORD: ${CDC_DB_PASSWORD:-${POSTGRES_PASSWORD:-ecoop}}
      DB_NAME: ${POSTGRES_DB:-ecoop}
      TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-ecoop}
      TABLE_INCLUDE_LIST: ${CDC_TABLE_INCLUDE_LIST:-public.users}
      SLOT_NAME: ${CDC_SLOT_NAME:-ecoop_debezium}
      PUBLICATION_NAME: ${CDC_PUBLICATION_NAME:-ecoop_debezium}
      SNAPSHOT_MODE: ${CDC_SNAPSHOT_MODE:-initial}
      TOPIC_REPLICATION_FACTOR: ${CDC_REPLICATION_FACTOR:-1}
      TOPIC_PARTITIONS: ${CDC_TOPIC_PARTITIONS:-3}
      REPLICA_IDENTITY_AUTOSET: ${CDC_REPLICA_IDENTITY_AUTOSET:-.*:FULL}
    volumes:
      - ./docker/debezium/register.sh:/register.sh:ro
    entrypoint: [ "sh", "/register.sh" ]
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "${SMTP_HOST:-127.0.0.1}:${SMTP_PORT:-1025}:1025"
      - "${SMTP_HOST:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app-network

  # ---- telemetry (docker compose --profile telemetry up -d) ----------------
  # Not part of the default stack: the app and its tests need none of it.
  # App -> otel-collector :14318 (OTLP/HTTP) -> Prometheus (metrics) and Tempo
  # (traces) -> Grafana :3000. Point the app at it with
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:14318
  #   OTEL_EXPORTER_OTLP_INSECURE=true
  otel-collector:
    profiles: [ telemetry ]
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_IMAGE_TAG:-0.120.0}
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - ./docker/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # 14318 on the host, not the standard 4318: other tracing stacks on a
      # developer machine commonly hold 4318, and a clash stops this one.
      - "127.0.0.1:${OTEL_COLLECTOR_PORT:-14318}:4318"
    networks:
      - app-network

  prometheus:
    profiles: [ telemetry ]
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-v3.2.1}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Prometheus 3 accepts OTLP metrics at /api/v1/otlp/v1/metrics once this
      # flag is set. It is a flag, not a feature name: the old
      # --enable-feature=otlp-write-receiver is rejected as unknown.
      - --web.enable-otlp-receiver
    volumes:
      - ./docker/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app-network

  tempo:
    profiles: [ telemetry ]
    image: grafana/tempo:${TEMPO_IMAGE_TAG:-2.7.1}
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./docker/otel/tempo.yaml:/etc/tempo/tempo.yaml:ro
    networks:
      - app-network

  grafana:
    profiles: [ telemetry ]
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-11.5.2}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./docker/otel/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./telemetry:/var/lib/grafana/dashboards/ecoop:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app-network

networks:
  app-network:

volumes:
  kafka-data:
  storage-data:
  postgres-data:
  postgres-read-data:
  valkey-data:
