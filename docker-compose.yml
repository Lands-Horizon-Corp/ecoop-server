name: ecoop-server

services:
    redis:
        image: redis:7-alpine
        ports: ['6379:6379'] # cache tests (REDIS_TEST_URL)
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 2s
            timeout: 2s
            retries: 15

    # Sentinel cache tests (REDIS_SENTINEL_ADDRS). The sentinel shares the master's
    # network namespace so it reports 127.0.0.1:6380, which the host can reach.
    # The password is a throwaway test credential.
    redis-master:
        image: redis:7-alpine
        command: redis-server --port 6380 --requirepass sentinel-test-pass
        ports:
            - '6380:6380' # master
            - '26379:26379' # sentinel (published here because it shares this namespace)
        healthcheck:
            test: ['CMD', 'redis-cli', '-p', '6380', '-a', 'sentinel-test-pass', '--no-auth-warning', 'ping']
            interval: 2s
            timeout: 2s
            retries: 15

    redis-sentinel:
        image: redis:7-alpine
        network_mode: 'service:redis-master'
        depends_on:
            redis-master:
                condition: service_healthy
        # Sentinel rewrites its config, so it is generated in a writable path.
        command: >
            sh -c 'printf "port 26379\nsentinel monitor mymaster 127.0.0.1 6380 1\nsentinel auth-pass mymaster sentinel-test-pass\nsentinel down-after-milliseconds mymaster 1000\n" > /tmp/sentinel.conf
            && exec redis-sentinel /tmp/sentinel.conf'
        healthcheck:
            test: ['CMD', 'redis-cli', '-p', '26379', 'sentinel', 'get-master-addr-by-name', 'mymaster']
            interval: 2s
            timeout: 2s
            retries: 15

    # Postgres for the SQL service tests (SQL_TEST_DSN). Throwaway test credentials.
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: ecoop
            POSTGRES_PASSWORD: ecoop-test-pass
            POSTGRES_DB: ecoop_test
        ports: ['5432:5432']
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ecoop -d ecoop_test']
            interval: 2s
            timeout: 2s
            retries: 15

    # Single-node Kafka (KRaft, no ZooKeeper) for the broker tests (KAFKA_TEST_BROKERS).
    kafka:
        image: apache/kafka:3.9.0
        ports: ['9092:9092']
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
        healthcheck:
            test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
            interval: 5s
            timeout: 10s
            retries: 20
            start_period: 15s

    # PgBouncer in transaction pooling mode in front of `postgres` (PGBOUNCER_TEST_DSN), matching
    # production. No DB_NAME, so it serves every database (the tests create throwaway ones).
    pgbouncer:
        image: edoburu/pgbouncer:latest
        environment:
            DB_HOST: postgres
            DB_USER: ecoop
            DB_PASSWORD: ecoop-test-pass
            AUTH_TYPE: scram-sha-256
            POOL_MODE: transaction
            MAX_PREPARED_STATEMENTS: '200'
            DEFAULT_POOL_SIZE: '20'
            MAX_CLIENT_CONN: '500'
        ports: ['6432:5432']
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'nc -z 127.0.0.1 5432']
            interval: 2s
            timeout: 2s
            retries: 15

    # --- `cdc` profile: production parity for the CDC, extension and PG16 suites -------------------
    # `make test-up-cdc`. Postgres 16 like production: a logical-replication writer for Debezium and a
    # read side with pg_search (BM25) and pg_partman. Kafka and Debezium Connect are separate from the
    # plain `kafka` above because Connect needs a listener it can reach inside the network.
    pg16-write:
        profiles: [cdc]
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_USER: ecoop
            POSTGRES_PASSWORD: ecoop-test-pass
            POSTGRES_DB: ecoop_test
        command: [postgres, -c, wal_level=logical, -c, max_wal_senders=40, -c, max_replication_slots=40]
        ports: ['5433:5432']
        networks: [default, cdc]
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ecoop -d ecoop_test']
            interval: 2s
            timeout: 2s
            retries: 30

    pg16-read:
        profiles: [cdc]
        build: ./.docker/postgres-read
        image: ecoop-server-pg16-read:latest
        environment:
            POSTGRES_USER: ecoop
            POSTGRES_PASSWORD: ecoop-test-pass
            POSTGRES_DB: ecoop_test
        # pg_search, pg_duckdb and timescaledb only activate when preloaded.
        command: [postgres, -c, 'shared_preload_libraries=pg_duckdb,timescaledb,pg_search']
        ports: ['5434:5432']
        networks: [default, cdc]
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ecoop -d ecoop_test']
            interval: 2s
            timeout: 2s
            retries: 30

    cdc-kafka:
        profiles: [cdc]
        image: apache/kafka:3.9.0
        # INTERNAL is what Debezium Connect uses inside the network; EXTERNAL is for the tests on the
        # host (CDC_KAFKA_BROKERS=localhost:9094).
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://cdc-kafka:29092,EXTERNAL://localhost:9094
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
        ports: ['9094:9094']
        networks: [cdc]
        healthcheck:
            test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1']
            interval: 5s
            timeout: 10s
            retries: 20
            start_period: 15s

    debezium-connect:
        profiles: [cdc]
        image: debezium/connect:2.7.3.Final
        environment:
            BOOTSTRAP_SERVERS: cdc-kafka:29092
            GROUP_ID: ecoop-connect
            CONFIG_STORAGE_TOPIC: ecoop_connect_configs
            OFFSET_STORAGE_TOPIC: ecoop_connect_offsets
            STATUS_STORAGE_TOPIC: ecoop_connect_status
        ports: ['8083:8083']
        networks: [cdc]
        depends_on:
            cdc-kafka:
                condition: service_healthy
            pg16-write:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'curl -sf http://localhost:8083/connectors > /dev/null']
            interval: 5s
            timeout: 5s
            retries: 40

    loki:
        image: grafana/loki:latest
        command: -config.file=/etc/loki/loki-config.yaml
        ports: ['3100:3100']
        volumes:
            - ./.docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
            - loki-data:/loki
        networks: [obs]

    tempo:
        image: grafana/tempo:latest
        command: -config.file=/etc/tempo/tempo.yaml
        ports: ['3200:3200'] # Tempo HTTP API (Grafana queries here)
        volumes:
            - ./.docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
            - tempo-data:/var/tempo
        networks: [obs]

    alloy:
        image: grafana/alloy:latest
        command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
        ports:
            - '4317:4317' # OTLP gRPC  (app -> alloy)
            - '4318:4318' # OTLP HTTP
            - '12345:12345' # Alloy UI / metrics
        volumes:
            - ./.docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
        depends_on: [loki, tempo]
        networks: [obs]

    grafana:
        image: grafana/grafana:latest
        ports: ['3000:3000']
        env_file: .env
        volumes:
            - ./.docker/grafana/provisioning:/etc/grafana/provisioning:ro
            - grafana-data:/var/lib/grafana
        depends_on: [loki, tempo]
        networks: [obs]

volumes:
    loki-data:
    tempo-data:
    grafana-data:

networks:
    obs:
    cdc:
