# Local stack for ecoop-server.
#
#   docker compose up -d                 -> infra only; run the app with `go run .`
#   docker compose --profile app up -d   -> infra + the app in a container
#
# Grafana: http://localhost:3000 (admin / admin)
#   Dashboards -> ecoop-server for metrics.
#   Explore -> Tempo for traces, Loki for logs, Prometheus for raw metrics.

name: ecoop

services:
  # Grafana + Loki (logs) + Tempo (traces) + Prometheus (metrics) + OTel collector, in one container.
  # The app sends OTLP to it on 4317 (gRPC) / 4318 (HTTP).
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - lgtm-data:/data
      # "ecoop-server" dashboard (Dashboards -> ecoop-server)
      - ./docker/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ecoop.yaml:ro
      - ./docker/grafana:/otel-lgtm/ecoop-dashboards:ro
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Containers use kafka:9092, your machine uses localhost:9094.
  kafka:
    image: apache/kafka:latest
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Pusher-compatible WebSocket server. The app talks to it with the Pusher SDK.
  sockudo:
    image: sockudo/sockudo:latest
    ports:
      - "6001:6001" # WebSocket + HTTP API
      - "9601:9601" # Prometheus metrics
    environment:
      RUST_LOG: info
      HOST: 0.0.0.0
      PORT: 6001
      METRICS_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9601
      DATABASE_REDIS_HOST: redis
      DATABASE_REDIS_PORT: 6379
      ADAPTER_DRIVER: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      RATE_LIMITER_DRIVER: redis
      APP_MANAGER_DRIVER: memory
      SOCKUDO_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOCKUDO_DEFAULT_APP_KEY: ${PUSHER_KEY}
      SOCKUDO_DEFAULT_APP_SECRET: ${PUSHER_SECRET}
      SOCKUDO_DEFAULT_APP_ENABLED: "true"
      SOCKUDO_ENABLE_CLIENT_MESSAGES: "true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  app:
    profiles: ["app"]
    build: .
    env_file: .env
    # Same .env, but container-to-container hostnames instead of localhost.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_READER_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKER: kafka:9092
      PUSHER_HOST: sockudo:6001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    ports:
      - "${APP_PORT}:${APP_PORT}"
      - "${GRPC_PORT}:${GRPC_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      sockudo:
        condition: service_started
      lgtm:
        condition: service_started
    restart: unless-stopped

volumes:
  lgtm-data:
  postgres-data:
  redis-data:
  kafka-data:
