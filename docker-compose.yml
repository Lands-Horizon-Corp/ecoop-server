
name: ecoop

services:
  postgres:
    image: postgres:18-alpine
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoop}
      POSTGRES_DB: ${POSTGRES_DB:-ecoop}
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - app-network

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$CACHE_PASSWORD\""]
    environment:
      CACHE_PASSWORD: ${CACHE_PASSWORD:-ecoop}
    ports:
      - "${CACHE_HOST:-127.0.0.1}:${CACHE_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$CACHE_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - app-network

  storage:
    image: rustfs/rustfs:${STORAGE_IMAGE_TAG:-latest}
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-ecoop}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-ecoop-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_VOLUMES: /data
    ports:
      - "${STORAGE_HOST:-127.0.0.1}:${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_HOST:-127.0.0.1}:${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    restart: unless-stopped
    networks:
      - app-network

  sockudo:
    image: sockudo/sockudo:${BROADCAST_IMAGE_TAG:-latest}
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      PORT: "6001"
      DEBUG: ${BROADCAST_DEBUG:-false}
      ADAPTER_DRIVER: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      RATE_LIMITER_DRIVER: redis
      REDIS_URL: redis://:${CACHE_PASSWORD:-ecoop}@valkey:6379/${BROADCAST_REDIS_DB:-2}
      SOCKUDO_DEFAULT_APP_ID: ${BROADCAST_APP_ID:-ecoop}
      SOCKUDO_DEFAULT_APP_KEY: ${BROADCAST_APP_KEY:-ecoop-key}
      SOCKUDO_DEFAULT_APP_SECRET: ${BROADCAST_APP_SECRET:-ecoop-secret}
      SOCKUDO_DEFAULT_APP_ENABLED: "true"
      SOCKUDO_DEFAULT_APP_MAX_EVENT_PAYLOAD_IN_KB: ${BROADCAST_MAX_PAYLOAD_KB:-5120}
      SOCKUDO_DEFAULT_APP_MAX_PRESENCE_MEMBER_SIZE_IN_KB: ${BROADCAST_MAX_PAYLOAD_KB:-5120}
      MAX_EVENT_PAYLOAD_IN_KB: ${BROADCAST_MAX_PAYLOAD_KB:-5120}
      MAX_PRESENCE_MEMBER_SIZE_IN_KB: ${BROADCAST_MAX_PAYLOAD_KB:-5120}
      WEBSOCKET_MAX_PAYLOAD_KB: ${BROADCAST_MAX_PAYLOAD_KB:-5120}
      METRICS_ENABLED: "true"
      PUSH_ALLOW_MEMORY_DRIVERS: "true"
    ports:
      - "${BROADCAST_HOST:-127.0.0.1}:${BROADCAST_PORT:-6001}:6001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:6001/up || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: unless-stopped
    networks:
      - app-network

  pdf-engine:
    image: zalven88/pdf-engine:${PDF_IMAGE_TAG:-1.1.0}
    depends_on:
      pdf-storage-setup:
        condition: service_completed_successfully
    environment:
      API_PORT: "6767"
      API_BEARER_TOKEN: ${PDF_ENGINE_API_BEARER_TOKEN:-change-me}
      STORAGE_URL: http://storage:9000 
      STORAGE_BUCKET: ${PDF_BUCKET:-pdfs}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-ecoop}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-ecoop-secret}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      RENDER_TIMEOUT_SECS: ${PDF_RENDER_TIMEOUT_SECS:-45}
    ports:
      - "${PDF_ENGINE_API_HOST:-127.0.0.1}:${PDF_ENGINE_API_PORT:-6767}:6767"
    healthcheck:
      test: ["CMD", "pdf-engine", "healthcheck"] 
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - app-network
      
  pdf-storage-setup:
    image: amazon/aws-cli:${PDF_SETUP_IMAGE_TAG:-latest}
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-ecoop}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-ecoop-secret}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      PDF_BUCKET: ${PDF_BUCKET:-pdfs}
    entrypoint: >
      sh -c "until aws --endpoint-url http://storage:9000 s3api head-bucket --bucket \"$$PDF_BUCKET\" 2>/dev/null ||
                   aws --endpoint-url http://storage:9000 s3 mb \"s3://$$PDF_BUCKET\"; do sleep 1; done"
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "${SMTP_HOST:-127.0.0.1}:${SMTP_PORT:-1025}:1025"
      - "${SMTP_HOST:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app-network

networks:
  app-network:

volumes:
  storage-data:
  postgres-data:
  valkey-data:
